name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          test -d "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          fi
          test -x "$SM"
          echo "Using $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug test
        run: ./gradlew assembleDebug test --no-daemon

  signed-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_CERT_SHA256: 4ec7529a8c0b1cbe00eedea1af0c2c0d8534cb8027d3ee33930cd058f37e22de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          test -d "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          fi
          test -x "$SM"
          echo "Using $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release keystore
        env:
          LYRIC_KEYSTORE_BASE64: ${{ secrets.LYRIC_KEYSTORE_BASE64 }}
          LYRIC_STORE_PASSWORD: ${{ secrets.LYRIC_STORE_PASSWORD }}
          LYRIC_KEY_ALIAS: ${{ secrets.LYRIC_KEY_ALIAS }}
          LYRIC_KEY_PASSWORD: ${{ secrets.LYRIC_KEY_PASSWORD }}
        run: |
          set +x
          umask 077
          if [ -z "$LYRIC_KEYSTORE_BASE64" ] || [ -z "$LYRIC_STORE_PASSWORD" ] || [ -z "$LYRIC_KEY_ALIAS" ] || [ -z "$LYRIC_KEY_PASSWORD" ]; then
            echo "Missing release signing secrets"
            exit 1
          fi
          KS="$RUNNER_TEMP/lyric-release.jks"
          PROPS="$RUNNER_TEMP/keystore.properties"
          printf '%s' "$LYRIC_KEYSTORE_BASE64" | base64 -d > "$KS"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS" "$LYRIC_STORE_PASSWORD" "$LYRIC_KEY_ALIAS" "$LYRIC_KEY_PASSWORD" > "$PROPS"
          echo "LYRIC_KEYSTORE_PROPERTIES=$PROPS" >> "$GITHUB_ENV"
      - name: Check tokens and licenses
        run: |
          bash tools/check-tokens.sh
          bash tools/check-licenses.sh
      - name: test and assembleRelease
        run: ./gradlew test assembleRelease --no-daemon
      - name: Verify certificate and name APK
        run: |
          set +x
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected a signed app-release.apk (unsigned output means signing secrets were not applied)"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          if [ ! -x "${BT}/apksigner" ]; then
            BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          fi
          "${BT}/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          CERT="$(awk '/SHA-256 digest:/{print $NF; exit}' "$RUNNER_TEMP/certs.txt" | tr 'A-F' 'a-f' | tr -cd '0-9a-f')"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Certificate SHA-256 mismatch: got $CERT expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          echo "Certificate SHA-256 matches."
          BADGING="$("${BT}/aapt" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | awk '/^package:/{print; exit}')"
          echo "$PACKAGE_LINE"
          # Anchor to the package: line — a greedy name= would match compileSdkVersionCodename='15'.
          PKG="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*[[:space:]]versionCode='\([^']*\)'.*/\1/p")"
          NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*[[:space:]]versionName='\([^']*\)'.*/\1/p")"
          if [ "$PKG" != "com.lyric.reader" ] || [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "Unexpected package or version in APK"
            exit 1
          fi
          OUT="lyric-${NAME}-vc${CODE}-release.apk"
          cp -f "$APK" "$OUT"
          echo "RELEASE_APK=$OUT" >> "$GITHUB_ENV"
          echo "Built $OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_APK }}
          fail_on_unmatched_files: true
          generate_release_notes: true
