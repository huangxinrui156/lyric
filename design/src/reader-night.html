.grain{opacity:.04;filter:invert(1)}</style></head><body><div class=status><span>10:47</span><span>◔ 86%</span></div><div class=ch>雪国 · 第一章</div><div class=txt><p>穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。火车在信号所前停了下来。</p><p>一位姑娘从对面座位上站起身子，把岛村座位前的玻璃窗打开。一股冷空气卷袭进来。姑娘将身子探出窗外，仿佛向远方呼唤似的喊道：</p><p>“站长先生，站长先生！”</p><p>一个把围巾缠到鼻子上、帽耳耷拉在耳朵边的男子，手拎提灯，踏着雪缓步走了过来。</p><p>岛村心想：已经这么冷了吗？他向窗外望去，只见铁路人员当作临时宿舍的木板房，星星点点地散落在山脚下，给人一种冷寂的感觉。</p></div><div class=foot><span>3 / 214</span><span>1.4%</span></div><div class=grain></div></body></html>
