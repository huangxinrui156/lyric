<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E6E0D5;font-family:"Noto Sans CJK SC",sans-serif;color:#2B2A27;display:flex;gap:20px;padding:20px}
.ph{width:360px;height:740px;background:#F4EFE6;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.hd{padding:28px 20px 0;display:flex;align-items:center}
.tt{font-family:"Noto Serif CJK SC",serif;font-size:30px;font-weight:600}.tt i{font-style:italic}
.sb{padding:4px 20px;font-size:13px;color:#8A8478}
.tg{margin-left:auto;height:32px;border-radius:16px;background:#EAE3D6;display:flex;font-size:13px;overflow:hidden}
.tg span{padding:0 12px;line-height:32px}.tg .on{background:#5E6B4E;color:#F4EFE6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}
.cv{aspect-ratio:3/4;border-radius:4px;background:#CFC6B4;position:relative}.cv b{position:absolute;top:6px;right:6px;background:#B5563A;color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;font-weight:400}
.nav{position:absolute;bottom:0;left:0;right:0;height:64px;border-top:1px solid #E2DACB;display:flex;justify-content:space-around;align-items:center;font-size:12px;background:#F4EFE6}
.nav .on{color:#5E6B4E;font-weight:600}
svg{position:absolute;left:60px;top:250px}
path{fill:none;stroke:#2B2A27;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cap{position:absolute;bottom:72px;width:100%;text-align:center;font-size:12px;color:#8A8478}
</style></head><body>
