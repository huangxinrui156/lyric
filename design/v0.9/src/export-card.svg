<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2280 1440" width="2280" height="1440"><rect width="2280" height="1440" fill="#fff"/>
<g transform="translate(0,0)"><rect width="1080" height="1440" rx="0" fill="#F4EFE6"/>
<rect x="96" y="300" width="4" height="200" fill="#B5563A"/>
<text font-family="Noto Serif CJK SC" fill="#2B2A27" font-size="64"><tspan x="140" y="370">人生如逆旅，</tspan><tspan x="140" y="470">我亦是行人。</tspan></text>
<line x1="96" y1="640" x2="984" y2="640" stroke="#D9D1C3" stroke-width="2"/>
<text font-family="Noto Serif CJK SC" fill="#8A8478" font-size="36"><tspan x="96" y="730">我的笔记</tspan></text>
<text font-family="Noto Serif CJK SC" fill="#2B2A27" font-size="40"><tspan x="96" y="810">读到这里想起第一次离家去南昌，</tspan><tspan x="96" y="870">站台上的风。</tspan></text>
<text font-family="Noto Serif CJK SC" fill="#8A8478" font-size="34"><tspan x="96" y="1230">《临江仙·送钱穆父》</tspan><tspan x="96" y="1285">苏轼  ·  2026.10.31</tspan></text>
<text font-family="Noto Serif CJK SC" fill="#8A8478" font-size="34" text-anchor="end" x="984" y="1285">lyric</text></g>
<g transform="translate(1200,0)"><rect width="1080" height="1440" rx="0" fill="#16171A"/>
<rect x="96" y="300" width="4" height="200" fill="#E08A6E"/>
<text font-family="Noto Serif CJK SC" fill="#D0CABE" font-size="64"><tspan x="140" y="370">人生如逆旅，</tspan><tspan x="140" y="470">我亦是行人。</tspan></text>
<line x1="96" y1="640" x2="984" y2="640" stroke="#2A2B2F" stroke-width="2"/>
<text font-family="Noto Serif CJK SC" fill="#7D786E" font-size="36"><tspan x="96" y="730">我的笔记</tspan></text>
<text font-family="Noto Serif CJK SC" fill="#D0CABE" font-size="40"><tspan x="96" y="810">读到这里想起第一次离家去南昌，</tspan><tspan x="96" y="870">站台上的风。</tspan></text>
<text font-family="Noto Serif CJK SC" fill="#7D786E" font-size="34"><tspan x="96" y="1230">《临江仙·送钱穆父》</tspan><tspan x="96" y="1285">苏轼  ·  2026.10.31</tspan></text>
<text font-family="Noto Serif CJK SC" fill="#7D786E" font-size="34" text-anchor="end" x="984" y="1285">lyric</text></g>
